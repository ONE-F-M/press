---
- name: Clone Agent Repository
  become: yes
  become_user: frappe
  git:
    repo: '{{ agent_repository_url }}'
    dest: /home/frappe/agent/repo
    remote: upstream
    version: '{% if agent_branch is defined and agent_branch is truthy %} {{ agent_branch }} {% else %} master {% endif %}'
    update: yes

- name: Ensure Agent virtualenv directory exists
  become: yes
  become_user: frappe
  command: virtualenv --python python3 /home/frappe/agent/env
  args:
    creates: /home/frappe/agent/env/pyvenv.cfg

# Debian/Ubuntu's patched Python virtualenv/venv creates a local/ compatibility
# layer where the real executables land in env/local/bin/, expecting a
# env/bin -> env/local/bin symlink to exist for standard tooling (including
# ansible's own pip module, which only ever checks env/bin/pip) to find them.
# That symlink isn't reliably created by virtualenv on Ubuntu 22.04, silently
# leaving env/bin missing entirely even though virtualenv reports success.
- name: Check if Agent virtualenv uses Debian/Ubuntu's patched local/bin layout
  stat:
    path: /home/frappe/agent/env/local/bin/pip
  register: agent_venv_debian_local_bin

- name: Check if Agent virtualenv already has a bin path
  stat:
    path: /home/frappe/agent/env/bin
  register: agent_venv_bin_dir

- name: Fix missing env/bin symlink for Debian/Ubuntu's patched Python venv layout
  become: yes
  become_user: frappe
  file:
    src: local/bin
    dest: /home/frappe/agent/env/bin
    state: link
  when: agent_venv_debian_local_bin.stat.exists and not agent_venv_bin_dir.stat.exists

- name: Ensure setuptools (pkg_resources) is present in the Agent virtualenv
  become: yes
  become_user: frappe
  pip:
    name: setuptools<81
    virtualenv: /home/frappe/agent/env
    virtualenv_python: python3
    state: forcereinstall

- name: Install Agent
  become: yes
  become_user: frappe
  pip:
    name: file:///home/frappe/agent/repo
    virtualenv: /home/frappe/agent/env
    virtualenv_python: python3
    editable: yes

- name: Generate Agent Configuration File
  become: yes
  become_user: frappe
  command: '/home/frappe/agent/env/bin/agent setup config --name {{ server }} --workers {{ workers }} {% if proxy_ip is defined and proxy_ip is truthy %}--proxy-ip {{ proxy_ip }}{% endif %} {% if agent_sentry_dsn is defined and agent_sentry_dsn is truthy %}--sentry-dsn {{ agent_sentry_dsn }}{% endif %}'
  args:
    chdir: /home/frappe/agent

- name: Setup Agent SQLite Database
  become: yes
  become_user: frappe
  command: /home/frappe/agent/env/bin/agent setup database
  args:
    chdir: /home/frappe/agent

- name: Setup Agent Usage Tracker
  become: yes
  become_user: frappe
  command: /home/frappe/agent/env/bin/agent setup usage
  args:
    chdir: /home/frappe/agent

- name: Setup Agent Site Analytics Tracker
  become: yes
  become_user: frappe
  command: /home/frappe/agent/env/bin/agent setup site-analytics
  args:
    chdir: /home/frappe/agent

- name: Create Agent NGINX Configuration Directory
  become: yes
  become_user: frappe
  file:
    dest: /home/frappe/agent/nginx
    state: directory

- name: Setup Agent Authentication
  become: yes
  become_user: frappe
  command: '/home/frappe/agent/env/bin/agent setup authentication --password {{ agent_password }}'
  args:
    chdir: /home/frappe/agent

- name: Symlink Agent Supervisor Configuration
  file:
    src: /home/frappe/agent/supervisor.conf
    dest: /etc/supervisor/conf.d/agent.conf
    state: link
    force: yes
    follow: no

- name: Create Logs Directory for Supervisor
  become: yes
  become_user: frappe
  file:
    dest: /home/frappe/agent/logs
    state: directory

- name: Setup Agent Supervisor
  become: yes
  become_user: frappe
  command: /home/frappe/agent/env/bin/agent setup supervisor
  args:
    chdir: /home/frappe/agent

- name: Create NGINX Root Configuration File
  become: yes
  become_user: frappe
  file:
    path: /home/frappe/agent/nginx/nginx.conf
    state: touch

- name: Symlink NGINX Root Configuration File
  file:
    src: /home/frappe/agent/nginx/nginx.conf
    dest: /etc/nginx/nginx.conf
    state: link
    force: yes
    follow: no

- name: Create Agent NGINX Configuration File
  become: yes
  become_user: frappe
  file:
    path: /home/frappe/agent/nginx.conf
    state: touch

- name: Symlink Agent NGINX Configuration File
  file:
    src: /home/frappe/agent/nginx.conf
    dest: /etc/nginx/conf.d/agent.conf
    state: link
    force: yes
    follow: no

- name: Create Agent TLS Directory
  become: yes
  become_user: frappe
  file:
    dest: /home/frappe/agent/tls
    state: directory

- name: Setup Agent TLS (Private Key)
  become: yes
  become_user: frappe
  copy:
    content: '{{ certificate_private_key }}'
    dest: /home/frappe/agent/tls/privkey.pem

- name: Setup Agent TLS (Full Chain)
  become: yes
  become_user: frappe
  copy:
    content: '{{ certificate_full_chain }}'
    dest: /home/frappe/agent/tls/fullchain.pem

- name: Setup Agent TLS (Intermediate Chain)
  become: yes
  become_user: frappe
  copy:
    content: '{{ certificate_intermediate_chain }}'
    dest: /home/frappe/agent/tls/chain.pem

- name: Setup Agent NGINX
  become: yes
  become_user: frappe
  command: /home/frappe/agent/env/bin/agent setup nginx
  args:
    chdir: /home/frappe/agent

- name: Setup Monitoring Authentication
  become: yes
  become_user: frappe
  command: 'htpasswd -Bbc /home/frappe/agent/nginx/monitoring.htpasswd frappe {{ monitoring_password }}'

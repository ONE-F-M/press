---
- name: Add MariaDB Debug Symbols Repository
  apt_repository:
    repo: deb https://packages.frappe.cloud/mariadb/10.6 focal main/debug
    state: present
    update_cache: false

- name: Update APT Cache (after adding MariaDB Debug Symbols repository)
  apt:
    update_cache: yes
  register: apt_update_result
  retries: 3
  delay: 15
  until: apt_update_result is succeeded
  ignore_errors: yes

- name: Use Debian Unattended Package Installation Mode
  shell: export DEBIAN_FRONTEND=noninteractive
  changed_when: false

- name: Install MariaDB
  apt:
    package: mariadb-server-core-10.6-dbgsym
    state: latest
